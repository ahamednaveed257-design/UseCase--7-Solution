services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: knowledge_curator
      POSTGRES_USER: knowledge_curator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.13.6
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"

  api:
    build: .
    environment:
      KC_ENVIRONMENT: local
      KC_ALLOW_HEADER_AUTH: "true"
      DATABASE_URL: postgresql://knowledge_curator:${POSTGRES_PASSWORD:-change-me-for-production}@postgres:5432/knowledge_curator
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - postgres
      - redis
      - qdrant

  streamlit:
    build: .
    command: ["python", "-m", "streamlit", "run", "streamlit_app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    environment:
      KC_ENVIRONMENT: local
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - api

volumes:
  postgres_data:
  qdrant_data:
